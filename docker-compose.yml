services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gce-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:8000
    stdin_open: true
    tty: true